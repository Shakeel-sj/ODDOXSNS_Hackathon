{% extends "base.html" %}

{% block title %}Calendar - {{ trip.name }}{% endblock %}

{% block extra_css %}
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.0/main.min.css" rel="stylesheet">
<style>
    #calendar {
        max-width: 100%;
        margin: 0 auto;
    }
</style>
{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h1>{{ trip.name }} - Calendar View</h1>
        <a href="{{ url_for('trips.view', id=trip.id) }}" class="text-decoration-none">
            <i class="bi bi-arrow-left"></i> Back to Trip
        </a>
    </div>
    <a href="{{ url_for('itinerary.view', trip_id=trip.id) }}" class="btn btn-outline-primary">
        <i class="bi bi-list"></i> List View
    </a>
</div>

<div id="calendar"></div>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.0/main.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const calendarEl = document.getElementById('calendar');
        const calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            events: '/calendar/trip/{{ trip.id }}/events',
            eventClick: function(info) {
                alert('Activity: ' + info.event.title);
            }
        });
        calendar.render();
    });
</script>
{% endblock %}
